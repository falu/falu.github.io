repository: "falu/falu.github.io"
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: default
locale: hu-HU
title: Falu:Me
logo: "/assets/images/icons8-house-with-a-garden-96.png"

author:
  name: "Falu"
  location: "Pécs, Magyarország"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/falu"
    - label: "X"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://x.com/falu"

url: https://falu.github.io
date_format: "%Y. %m. %d."
excerpt_separator: "<!--more-->"

# kereső
search: true
search_provider: lunr

# A jövőbeli posztokat is mindig kiadja
future: true

comments:
  provider: giscus
  giscus:
    repo_id: "R_kgDOSsipIw"
    category_name: "General"
    category_id: "DIC_kwDOSsipI84C-Oxw"
    discussion_term: "pathname"
    reactions_enabled: "1"
    theme: "light"

plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-paginate

# Címke- és kategóriaoldalak generálása
tag_archive:
  type: liquid
  path: /tags/
# category_archive:
#  type: liquid
#  path: /categories/

# Posztok alapbeállításai: layout, szerző-doboz, dátum, olvasási idő
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true

# Bloglista a főoldalon
paginate: 5
paginate_path: /page:num/

# Oldalak
include:
  - _pages

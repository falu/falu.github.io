<div class="list__item">
  <article class="archive__item">
    <h2 class="archive__item-title">
      {% if include.pinned %}📌 {% endif %}
      <a href="{{ include.post.url | relative_url }}" rel="permalink">{{ include.post.title }}</a>
    </h2>
    {% if include.post.header.teaser %}
      <div class="archive__item-teaser">
        <a href="{{ include.post.url | relative_url }}">
          <img src="{{ include.post.header.teaser | relative_url }}" alt="">
        </a>
      </div>
    {% endif %}
    {% if include.post.excerpt %}
      <p class="archive__item-excerpt">{{ include.post.excerpt | markdownify }}</p>
    {% endif %}
  </article>
</div>

<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 640" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>A self-hosted zenei stack komponensei és kapcsolataik</title>
<desc>Az Asustor NAS-on Docker CE fut, abban Portainer és Navidrome, valamint egy Tailscale kliens. A telefonon Symfonium, Android Auto, Pano Scrobbler és szintén egy Tailscale kliens. A két Tailscale kliens közt titkosított alagút köti össze a NAS-t és a telefont. A Pano Scrobbler a last.fm felé küld adatot.</desc>
<style>
  .t  { font-size: 14px; font-weight: 400; }
  .ts { font-size: 12px; }
  .th { font-size: 14px; font-weight: 500; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- ===== NAS container ===== -->
<rect x="40" y="40" width="300" height="360" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="60" y="68" fill="#042C53">Asustor AS4004T (NAS)</text>
<text class="ts" x="60" y="86" fill="#0C447C">a saját szerver</text>

<!-- Docker CE container inside NAS -->
<rect x="64" y="104" width="252" height="216" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="84" y="130" fill="#04342C">Docker CE</text>
<text class="ts" x="84" y="148" fill="#085041">konténer futtatókörnyezet</text>

<!-- Portainer -->
<rect x="88" y="170" width="204" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="190" y="190" text-anchor="middle" dominant-baseline="central" fill="#26215C">Portainer CE</text>
<text class="ts" x="190" y="208" text-anchor="middle" dominant-baseline="central" fill="#3C3489">grafikus Docker-kezelő</text>

<!-- Navidrome -->
<rect x="88" y="244" width="204" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="190" y="264" text-anchor="middle" dominant-baseline="central" fill="#412402">Navidrome</text>
<text class="ts" x="190" y="282" text-anchor="middle" dominant-baseline="central" fill="#633806">zenei szerver, Subsonic API</text>

<!-- Tailscale client on NAS -->
<rect x="88" y="338" width="204" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="190" y="361" text-anchor="middle" dominant-baseline="central" fill="#26215C">Tailscale kliens</text>

<!-- ===== Phone container ===== -->
<rect x="40" y="430" width="300" height="180" rx="20" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="th" x="60" y="458" fill="#173404">OnePlus 15 (telefon)</text>
<text class="ts" x="60" y="476" fill="#27500A">a kliens oldal</text>

<!-- Tailscale client on phone -->
<rect x="88" y="492" width="204" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="190" y="512" text-anchor="middle" dominant-baseline="central" fill="#26215C">Tailscale kliens</text>

<!-- Symfonium -->
<rect x="88" y="544" width="96" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="136" y="563" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C">Symfonium</text>
<text class="ts" x="136" y="581" text-anchor="middle" dominant-baseline="central" fill="#712B13">lejátszó</text>

<!-- Android Auto -->
<rect x="196" y="544" width="96" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="244" y="563" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Android</text>
<text class="th" x="244" y="581" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Auto</text>

<!-- ===== Pano Scrobbler (right, phone-side) ===== -->
<rect x="448" y="492" width="180" height="52" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text class="th" x="538" y="511" text-anchor="middle" dominant-baseline="central" fill="#4B1528">Pano Scrobbler</text>
<text class="ts" x="538" y="529" text-anchor="middle" dominant-baseline="central" fill="#72243E">figyeli a lejátszást</text>

<!-- ===== last.fm (right top) ===== -->
<rect x="448" y="372" width="180" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text class="th" x="538" y="392" text-anchor="middle" dominant-baseline="central" fill="#501313">last.fm</text>
<text class="ts" x="538" y="410" text-anchor="middle" dominant-baseline="central" fill="#791F1F">scrobble statisztika</text>

<!-- ===== Connections ===== -->
<!-- Navidrome down to NAS Tailscale client -->
<line x1="190" y1="300" x2="190" y2="338" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Tailscale tunnel between the two clients (double-headed) -->
<path d="M306 361 L390 361 L390 512 L306 512" fill="none" stroke="#534AB7" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="398" y="432" text-anchor="start" fill="#3C3489">titkosított</text>
<text class="ts" x="398" y="448" text-anchor="start" fill="#3C3489">alagút (VPN)</text>

<!-- Phone Tailscale client down to Symfonium -->
<line x1="136" y1="532" x2="136" y2="544" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Symfonium to Android Auto -->
<line x1="184" y1="570" x2="196" y2="570" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Symfonium / Pano Scrobbler: phone playback observed by Pano -->
<path d="M292 560 L370 560 L370 518 L448 518" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Pano Scrobbler up to last.fm -->
<line x1="538" y1="492" x2="538" y2="428" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
